<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How countries govern industrial competitiveness</title>

<style>
:root{
  --ink:#121212; --muted:#4A4A4A; --faint:#767676;
  --hair:#DFDFDF; --ground:#FFFFFF; --shade:#F1F1F1;
  --accent:#003B48; --sage:#CEDAAA;
  --font:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px 96px}

/* masthead */
.masthead{border-bottom:1px solid var(--hair)}
.masthead .wrap{padding-top:20px;padding-bottom:20px}
.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:700;font-size:clamp(22px,2.8vw,29px);letter-spacing:-.012em;margin:7px 0 0}

/* country tabs */
.tabs{display:flex;flex-wrap:wrap;gap:0;margin:0;padding:0;list-style:none;border-bottom:1px solid var(--hair)}
.tab{display:inline-flex;align-items:center;gap:10px;padding:16px 22px;background:none;border:0;
  border-bottom:3px solid transparent;font-family:inherit;font-weight:600;font-size:17px;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab svg{display:block;border:1px solid var(--hair)}
.tab .soon{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* country intro */
.intro{margin:40px 0 34px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:44px;align-items:start}
.hint{display:flex;align-items:center;gap:10px;margin:0 0 26px;font-size:16px;color:var(--muted)}
.hint i{flex:none}
.intro h2{font-weight:700;letter-spacing:-.018em;font-size:clamp(30px,4vw,42px);margin:0;line-height:1.04}
.intro p{margin:0;font-size:18px;color:var(--muted);line-height:1.55}
@media(max-width:800px){.intro{grid-template-columns:1fr;gap:16px}}

/* ---------- diagram ---------- */
.board{position:relative}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.wires.top{z-index:4}

.lanes,.layer{display:grid;grid-template-columns:154px minmax(0,1fr);gap:0 26px;align-items:start}
.lanes{margin-bottom:4px}
.layer + .lanes{margin-top:40px}
.layer{margin-top:58px}
.layer:first-of-type{margin-top:10px}
.layer:last-of-type{padding-bottom:62px}
.lane-h{position:relative;z-index:2;background:var(--ground);font-size:13px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  padding:6px 0 9px;border-bottom:1px solid var(--hair)}

.lhead{padding-top:3px}
.lhead .num{font-size:13px;font-weight:700;color:var(--faint);letter-spacing:.12em}
.lhead .nm{font-size:21px;font-weight:700;letter-spacing:-.014em;margin-top:2px;line-height:1.12}
.lhead .note{font-size:14.5px;color:var(--muted);margin-top:5px;line-height:1.32}

.row{display:grid;gap:0 22px;position:relative}

.node{grid-row:1;min-width:0;background:var(--ground);border:1px solid var(--hair);border-radius:5px;
  padding:15px 17px;min-height:88px;text-align:left;font-family:inherit;color:inherit;cursor:pointer;
  overflow-wrap:break-word;
  display:flex;flex-direction:column;justify-content:center;gap:5px;position:relative;
  transition:border-color .12s,box-shadow .12s}
.node:hover{border-color:var(--accent)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node .nm{font-size:19px;font-weight:700;letter-spacing:-.012em;line-height:1.18}
.node .role{font-size:15px;color:var(--muted);line-height:1.32}
.node.mech{background:var(--shade);border-color:transparent}
.node.shared{background:var(--shade)}
.node.tri{box-shadow:inset 3px 0 0 var(--accent)}
.node.mech .nm{font-weight:600}
.node.detached{border-style:dashed}
.node.opt{box-shadow:inset 0 3px 0 var(--sage)}
.node.opt .role{color:var(--faint)}
.node .rels{position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.5}
.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.node.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent),inset 0 3px 0 var(--sage)}
.node.tri[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--accent),inset 3px 0 0 var(--accent)}
.node[aria-pressed="true"] .rels{opacity:1}
.node.linked{border-color:var(--accent)}

/* an empty layer, where the absence is the finding */
.absent{grid-row:1;grid-column:1 / -1;border:1px dashed var(--hair);border-radius:5px;
  padding:15px 18px;min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  background:var(--ground)}
.absent .nm{font-size:17px;font-weight:700;color:var(--faint)}
.absent p{margin:0;font-size:15px;color:var(--muted);max-width:88ch;line-height:1.4}

.wirelab{font-family:var(--font);font-size:13px;font-weight:600;fill:var(--accent);
  paint-order:stroke;stroke:var(--ground);stroke-width:5px;stroke-linejoin:round}

.legend{display:flex;flex-wrap:wrap;gap:26px;margin:34px 0 0;padding-top:16px;border-top:1px solid var(--hair);
  font-size:14.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:9px}
.key{width:26px;height:15px;border-radius:3px;border:1px solid var(--hair);background:var(--ground);flex:none}
.key.mech{background:var(--shade);border-color:transparent}
.key.shared{background:var(--shade)}
.key.tri{box-shadow:inset 3px 0 0 var(--accent)}
.key.opt{box-shadow:inset 0 3px 0 var(--sage)}
.key.det{border-style:dashed}
.key.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);border:0}

/* ---------- disputed outcomes ---------- */
.dispute{margin:36px 0 0;padding-top:22px;border-top:1px solid var(--hair)}
.dispute h4{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.dispute .cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:16px}
.dispute .side b{display:block;font-size:16px;margin-bottom:5px}
.dispute .side p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.45}
.dispute .foot{margin:18px 0 0;font-size:15.5px;color:var(--muted);max-width:96ch;line-height:1.45}
@media(max-width:820px){.dispute .cols{grid-template-columns:1fr;gap:20px}}

/* ---------- detail ---------- */
.detail{margin-top:38px;padding-top:26px;border-top:2px solid var(--ink);min-height:150px}
.detail .kicker{font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.detail h3{font-weight:700;font-size:30px;letter-spacing:-.016em;margin:8px 0 0;line-height:1.12}
.detail .lede{margin:11px 0 0;font-size:19px;max-width:74ch;line-height:1.45;color:var(--ink)}
.detail dl{margin:26px 0 0;display:grid;grid-template-columns:230px minmax(0,1fr);gap:0}
.detail dt{font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  padding:15px 26px 15px 0;border-top:1px solid var(--hair)}
.detail dd{margin:0;font-size:17px;line-height:1.5;max-width:80ch;padding:15px 0;border-top:1px solid var(--hair)}
.detail .idle{color:var(--muted);font-size:18px;margin:0;max-width:60ch}
@media(max-width:820px){
  .detail dl{grid-template-columns:1fr}
  .detail dt{padding:14px 0 0;border-top:1px solid var(--hair)}
  .detail dd{padding:4px 0 14px;border-top:0}
}

/* validator panel, only with ?check */
#check{position:fixed;right:14px;bottom:14px;max-width:420px;max-height:52vh;overflow:auto;z-index:99;
  background:var(--ground);border:1px solid var(--ink);border-radius:5px;padding:14px 16px;font-size:13.5px;
  box-shadow:0 6px 26px rgba(0,0,0,.12)}
#check b{display:block;margin-bottom:6px;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
#check ul{margin:0;padding-left:17px}
#check li{margin:3px 0;color:var(--muted)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="masthead"><div class="wrap">
  <div class="brand">Four countries compared</div>
  <h1>How countries govern industrial competitiveness</h1>
</div></header>

<div class="wrap">
  <ul class="tabs" role="tablist" id="tabs"></ul>
  <main id="stage"></main>
</div>

<script>
/* ============================================================================
   ADDING A COUNTRY
   ----------------------------------------------------------------------------
   No pixel coordinates. Layout comes from the grid; connectors are measured
   from the rendered boxes, so a country is pure data.

   lanes  : [ {key:'gov', label:'Government', cols:3}, {key:'ind', ...} ]
   lanesFrom : optional. Layers above this number run full width on gcol/gspan.
   node   : { id, layer:1-6,
              lane, col, span,          // inside a lane
              gcol, gspan,              // on the full-width track
              kind, name, role,         // role = 3 or 4 words, or the owner
              detail:[ ['Label','Fact'], ... ] }
   flow   : [ {from,to} ]               // solid, always drawn, downward only
   rel    : [ {from,to,label,note} ]    // curved, only on selection
   absent : { 6:'Why this layer is empty.' }   // renders the gap as a finding
   dispute: { title, sides:[[label,text]], foot }

   kind = 'body' | 'mechanism' | 'option' | 'detached' | 'shared' | 'tripartite'
   'option' is layer 05 only: a route rather than a body. Its role line names
   the body that owns the route.
   ============================================================================ */

const LAYERS=[
 {num:'01',name:'Foresight',  note:'Studies what is coming. Advises only.'},
 {num:'02',name:'Direction',  note:'Decides what to back.'},
 {num:'03',name:'Translation',note:'Turns it into an offer.'},
 {num:'04',name:'Delivery',   note:'Money, demand and support.'},
 {num:'05',name:'Capability', note:'The routes for closing a gap.'},
 {num:'06',name:'Ground',     note:'Land and permission.'}
];

const FLAGS={
 brazil:`<svg width="26" height="18" viewBox="0 0 70 49"><rect width="70" height="49" fill="#009B3A"/><path d="M35 6 64 24.5 35 43 6 24.5Z" fill="#FEDF00"/><circle cx="35" cy="24.5" r="11" fill="#002776"/><path d="M25 21.5a13 13 0 0 0 20 0" stroke="#fff" stroke-width="2.6" fill="none"/></svg>`,
 singapore:`<svg width="26" height="18" viewBox="0 0 72 48"><rect width="72" height="48" fill="#fff"/><rect width="72" height="24" fill="#ED2939"/><circle cx="14" cy="12" r="8" fill="#fff"/><circle cx="19" cy="12" r="7" fill="#ED2939"/><g fill="#fff"><circle cx="23" cy="7" r="1.6"/><circle cx="27" cy="10.5" r="1.6"/><circle cx="25.5" cy="16" r="1.6"/><circle cx="20.5" cy="16" r="1.6"/><circle cx="19" cy="10.5" r="1.6"/></g></svg>`,
 uae:`<svg width="26" height="18" viewBox="0 0 72 36"><rect width="72" height="12" fill="#00732F"/><rect y="12" width="72" height="12" fill="#fff"/><rect y="24" width="72" height="12" fill="#000"/><rect width="18" height="36" fill="#FF0000"/></svg>`,
 usa:`<svg width="26" height="18" viewBox="0 0 76 40"><rect width="76" height="40" fill="#fff"/><g fill="#B22234"><rect width="76" height="3.1"/><rect y="6.2" width="76" height="3.1"/><rect y="12.3" width="76" height="3.1"/><rect y="18.5" width="76" height="3.1"/><rect y="24.6" width="76" height="3.1"/><rect y="30.8" width="76" height="3.1"/><rect y="36.9" width="76" height="3.1"/></g><rect width="30.4" height="21.5" fill="#3C3B6E"/></svg>`
};

const COUNTRIES=[
{
 id:'brazil', name:'Brazil', flag:FLAGS.brazil,
 sub:'Two complete systems run side by side. Government sets national missions. Industry runs its own strategy, funded by a charge on wages that no government can switch off.',
 lanes:[{key:'gov',label:'Government',cols:3},{key:'ind',label:'Industry',cols:2}],
 nodes:[
  {id:'sci',layer:1,lane:'gov',col:1,span:2,kind:'body',
   name:'Science ministry',role:'Holds a seat on the council',
   detail:[['Its full name','The Ministry of Science, Technology and Innovation.'],
           ['Its seat','Decree 11.482 of 2023 lists the science minister among the ministers composing the industrial council. The planning and budget minister is listed too. Government foresight does reach the table where missions are set.'],
           ['What it does not have','A standing industrial foresight unit. It is a ministry with a seat, not a body whose job is to project where industry is heading, which is what industry built for itself on the right.'],
           ['The real asymmetry','Compare the two sides of this row. Industry runs a permanent in house observatory pointed at its own skills gap. Government relies on ministries that each carry a wider brief.'],
           ['Note on an earlier version','An earlier build of this map drew this box as detached, on the claim that neither science nor planning held a council seat. That was wrong. Both are named in the decree.']]},
  {id:'obs',layer:1,lane:'ind',col:1,span:2,kind:'body',
   name:'Industry Observatory',role:'Projects the skills gap ahead',
   detail:[['Owner','The confederation. A permanent in house unit, not a commissioned study.'],
           ['Why it matters','The only body in this chain whose job is to look forward.'],
           ['What it feeds','Industry’s ten year plan, and which institutes and courses get opened.']]},

  {id:'cndi',layer:2,lane:'gov',col:1,span:2,kind:'body',
   name:'CNDI',role:'Government council, sets missions',
   detail:[['Full name','National Council for Industrial Development, known as CNDI.'],
           ['Created','2004. It sat dormant for about eight years and was restructured and reactivated by Decree 11.482 of April 2023.'],
           ['Who chairs it','Geraldo Alckmin, who is Vice President and also Minister of Development, Industry, Trade and Services. The person chairing the council runs the ministry that implements it.'],
           ['Who sits on it','Two sides in roughly equal number. On one, a long list of ministers including science, planning, finance, defence, health, education, labour, mines and energy, plus the president of the development bank. On the other, counsellors from industry and from the unions, including the president of the industry confederation. Seat counts have shifted with later amendments to the decree.'],
           ['What it produced','Nova Indústria Brasil, the industrial policy launched on 29 January 2024, with six missions and targets running to 2033.'],
           ['The six missions','Health, defence, digital, agriculture, bioeconomy and infrastructure, each with quantified targets. Mission six, for example, targets national control of 55 per cent of critical defence technologies by 2026 and 75 per cent by 2033.'],
           ['Its power','Its decisions become government policy and set what qualifies for subsidised state credit.'],
           ['Its limit','It holds no budget, and it stops the moment a government stops convening it. It has been switched off once already.']]},
  {id:'cni',layer:2,lane:'ind',col:1,span:2,kind:'body',
   name:'CNI',role:'Industry’s own confederation',
   detail:[['Full name','National Confederation of Industry.'],
           ['Founded','1938, by four state federations, and never interrupted since.'],
           ['Why the date matters','Industry’s decision body is older than most government agencies it deals with, and has never been switched off.'],
           ['Who owns it','The 27 state federations. It is a private body, not a public one.'],
           ['What it sets','A plan targeting the conditions for competitiveness: tax, education and energy cost.'],
           ['Its power','It directs the training, welfare and management arms beneath it, funded by the payroll levy rather than by any budget a government votes on. Treat any single figure for the system’s annual spend as needing a source before you quote it.'],
           ['Its limit','It can compel nobody. It directs its own system and lobbies government.']]},

  {id:'credit',layer:3,lane:'gov',col:1,kind:'mechanism',
   name:'Missions unlock credit',role:'The default route',
   detail:[['What it is called','Plano Mais Produção, the main financing instrument of the industrial policy.'],
           ['Why this is not a body','No institution sits between a mission and a company. The mission becomes the eligibility rule, and the funders lend against it.'],
           ['Scale','More than R$700 billion of credit to be mobilised over four years. R$653.2 billion was approved in the first two years across about 428,000 projects.'],
           ['What it does define','Mission level targets with dates, which is real direction.'],
           ['What it does not define','A sector by sector roadmap. Nothing tells a given industry which capabilities to build, which is the sharpest contrast with Singapore, where 23 sectors each get a plan naming the job roles.']]},
  {id:'prog',layer:3,lane:'gov',col:2,kind:'mechanism',
   name:'Custom programmes',role:'Built one at a time',
   detail:[['Why this is not a body','Each programme is assembled from scratch, then dissolved into the agencies that run it.'],
           ['How often','Twice at scale: one for factory productivity, one for automotive research.'],
           ['Coordination by assignment','The productivity programme gives each body a role. A ministry coordinates, the training system delivers shop floor work, the funders pay. About 67,500 companies supported.'],
           ['Coordination by rule','The automotive programme writes it into the funding conditions: five or more carmakers, one accredited research centre, one industry institute as coordinator.']]},
  {id:'mei',layer:3,lane:'ind',col:1,kind:'body',
   name:'MEI',role:'Platform of chief executives',
   detail:[['Full name','Business Mobilization for Innovation.'],
           ['Founded','2008, by the confederation.'],
           ['Who is in the room','Around 200 to 300 of the largest companies in Brazil, represented by their chief executives or board members, sitting on a Business Leaders Committee.'],
           ['What it actually is','A movement, not a legal entity. No budget, almost no staff. Its power is that the people in the room run the companies.'],
           ['How a gap gets closed','The observatory finds it, this committee decides it matters, the confederation points its money at it, the institutes deliver it.'],
           ['What it has built','It backed the creation of the SENAI Technology Institutes network.'],
           ['What it changed in law','It defended the 2005 research tax incentive from suspension, and backed the 2021 law that stopped the Treasury blocking the national science fund, which is the fund FINEP depends on.']]},
  {id:'feds',layer:3,lane:'ind',col:2,kind:'body',
   name:'The federations',role:'Political force, not delivery',
   detail:[['What they are','27 state federations, one per state plus the Federal District, such as FIESP in Sao Paulo, together with roughly 1,250 employer unions beneath them.'],
           ['Their age','The structure dates from the 1930s. FIESP was founded in 1931, before the national confederation existed.'],
           ['What they do','Represent members and apply political pressure. They own the confederation above them.'],
           ['What they do not do','No training, no research, no services. That is the job of the institutes their system owns.'],
           ['The 2017 break','A labour reform made their dues voluntary. Their money became optional at the same moment the delivery arm’s payroll charge stayed compulsory.'],
           ['No line to government','Neither the federations, the unions nor the million companies connect directly to the government side. Everything routes through the confederation.']]},

  {id:'bndes',layer:4,lane:'gov',col:1,kind:'body',
   name:'BNDES',role:'The development bank',
   detail:[['Created','1952.'],
           ['Where its money comes from','A national workers support fund, the FAT, is its largest single source, at about 52 per cent of funding sources at the end of 2025. The rest is Treasury, government funds, external borrowing and bond issues.'],
           ['Its scale in this policy','It is the principal financial agent of the credit plan, with R$300 billion approved for reindustrialisation projects and a further R$70 billion announced.'],
           ['Read the headline number carefully','The widely quoted R$653.2 billion across 428,000 projects is the total for the whole credit plan across every funder, not this bank alone. This bank is roughly half of it.'],
           ['A second role','It lent the money that originally built industry’s own training institutes.']]},
  {id:'finep',layer:4,lane:'gov',col:2,kind:'body',
   name:'FINEP',role:'The innovation agency',
   detail:[['Created','1967.'],
           ['Where its money comes from','The national science and technology fund, the FNDCT, filled by levies including oil, energy and mining royalties. This agency operates those resources.'],
           ['The vulnerability, with a number on it','In 2020 the fund had more than R$6 billion authorised in the budget and about R$5 billion of it could not be spent on science, because it was frozen to help hit the primary balance target.'],
           ['What fixed it','Complementary Law 177 of 2021 bars any limit on executing FNDCT linked spending and bars parking its budget in a contingency reserve. It was sanctioned with vetoes, Congress overrode them in March 2021, and industry publicly campaigned for that override.'],
           ['Why this matters to the map','A legally earmarked fund was still not safe. It took a supermajority in Congress to make the money actually reachable.']]},
  {id:'embr',layer:4,lane:'gov',col:3,kind:'body',
   name:'EMBRAPII',role:'Research agency, co-funds work',
   detail:[['Created','2013, after industry lobbied for it.'],
           ['How it is funded','A ministry contract, plus money the company itself puts in.'],
           ['Who steers it','Industry holds seats on its board, so a public agency is partly directed by the private side.']]},

  {id:'cofund',layer:5,lane:'gov',col:1,kind:'option',
   name:'Co-fund company research',role:'Applied research agency',
   detail:[['Owner','EMBRAPII, the public agency one row above.'],
           ['How the route works','A ministry contract plus money the company itself puts in, so a firm pays for part of its own answer.'],
           ['Who steers it','Industry lobbied it into existence in 2013 and holds board seats, so a public route is partly directed by the private side.'],
           ['What it closes','A know how gap inside one company, project by project. It builds no standing capacity.']]},
  {id:'loan',layer:5,lane:'gov',col:2,kind:'option',
   name:'Lend against a mission',role:'Development bank',
   detail:[['Owner','BNDES, created 1952, as principal agent of the credit plan.'],
           ['How the route works','The missions define what qualifies, and the bank lends against them. Nothing else has to be written.'],
           ['Scale','R$300 billion approved by this bank, inside a plan that approved R$653.2 billion across about 428,000 projects in two years counting every funder.'],
           ['What it does not close','This route closes a money gap. Nobody is trained by a loan, which is why the government side of this row is thinner than it looks.']]},
  {id:'train',layer:5,lane:'ind',col:1,kind:'option',
   name:'Train through the levy',role:'Industry institutes',
   detail:[['Owner','SENAI, SESI and IEL. Set up by law from the 1940s, then handed to industry to run. Private bodies carrying out a public task.'],
           ['How it is funded','A compulsory charge on payroll, mandatory for industrial companies: 1.5% to the welfare arm and 1.0% to the training arm, plus a further 0.2% to training from companies with more than 500 employees.'],
           ['Why it is stable','It needs no annual budget approval, so it does not stop when a government changes.'],
           ['Why it could not simply be abolished','Article 240 of the 1988 Constitution carries these bodies and their compulsory contributions over expressly. The levy sits in the Constitution, not in an ordinary statute.'],
           ['The proof','The 2017 labour reform made the union dues that fund the political arm voluntary and left this levy untouched. The lobbying side was defunded and the execution side was not.'],
           ['Scale','Around 3 million enrolments a year, on the largest private professional education network in the country, present in 26 states and the Federal District.'],
           ['Why it sits on this side','This is the only route on the row that creates a skill, and industry owns it.']]},
  {id:'newinst',layer:5,lane:'ind',col:2,kind:'option',
   name:'Build a new institute',role:'Industry lobbies for it',
   detail:[['Owner','Nobody standing. The confederation asks government to create a new instrument.'],
           ['When it is used','When a gap is too large for industry to close alone.'],
           ['What it has produced','This is how the applied research agency on the government side came to exist, in 2013.'],
           ['Its limit','It depends on a government willing to create something, so it is the slowest route on the page and the only one with no owner of its own.']]}
 ],
 flow:[
  {from:'sci',to:'cndi'},{from:'obs',to:'cni'},
  {from:'cndi',to:'credit'},{from:'cndi',to:'prog'},
  {from:'cni',to:'mei'},{from:'cni',to:'feds'},
  {from:'credit',to:'bndes'},{from:'credit',to:'finep'},

  {from:'bndes',to:'loan'},{from:'embr',to:'cofund'},

 ],

{
 id:'singapore', name:'Singapore', flag:FLAGS.singapore,
 sub:'One chain, no separate towers. What is unusual is that government, business and unions sit inside the same bodies rather than beside them, and that a sector plan is traced all the way down into named job roles and funded retraining.',
 lanes:[{key:'one',label:'One chain, all parties inside it',cols:4}],
 nodes:[
  {id:'csf',layer:1,lane:'one',col:1,span:2,kind:'body',
   name:'Strategic Futures centre',role:'Permanent, never closes',
   detail:[['Its full name','The Centre for Strategic Futures.'],
           ['Established','Early 2009. Since 1 July 2015 it has sat inside the Strategy Group of the Prime Minister’s Office.'],
           ['What it is','A think tank and foresight unit at the centre of government, not a commissioned study and not an advisory panel.'],
           ['Why it is unusual','It is a standing institution whose job is to look ahead. Neither of the other countries mapped here has an equivalent inside government.']]},
  {id:'review',layer:1,lane:'one',col:3,span:2,kind:'tripartite',
   name:'Economic review',role:'Convened, reports, closes',
   detail:[['What it is','A major review of economic strategy, convened roughly every seven years and then dissolved.'],
           ['The sequence','An Economic Strategies Committee reported in 2010. A Committee on the Future Economy ran from January 2016 to February 2017. An Economic Strategy Review was convened in August 2025 and reported in May 2026.'],
           ['How it is structured','Five committees, each co-chaired by two political office holders, with members drawn from the private sector, the unions and other stakeholders. The five briefs are global competitiveness, technology and innovation, entrepreneurship, human capital, and managing the impact of restructuring.'],
           ['The tripartite proof, in one person','The restructuring committee is co-chaired by Desmond Choo, who is at once Minister of State for Defence and deputy secretary-general of the union congress. The union voice is not consulted from outside. It is one of the two people in the chair.'],
           ['Who oversees it','The Singapore Economic Resilience Taskforce, chaired by Deputy Prime Minister and Trade and Industry Minister Gan Kim Yong. The person running the review runs the ministry that implements it.'],
           ['How wide it consults','More than 7,700 stakeholders since the committees convened.'],
           ['What it produced','32 recommendations grouped into eight thrusts, four on securing growth and four on creating good jobs, presented on 13 May 2026 at the business federation’s Future Economy Conference. Three imperatives frame it: sharpen the value proposition, become more agile and adaptable, and build resilience alongside efficiency.'],
           ['It moved before it finished','A mid term update on 30 January 2026 set out seven strategies, four of them on artificial intelligence. The Budget of 12 February 2026 acted on them, which is why parts of this review were already law before the final report appeared.']]},

  {id:'cabinet',layer:2,lane:'one',col:1,span:2,kind:'body',
   name:'Cabinet',role:'Funds it in the Budget',
   detail:[['What it does','Accepts the review’s recommendations and turns them into funded commitments.'],
           ['Why the Budget is the hinge','Nothing becomes real until it has a Budget line and a named owner. The Budget of 12 February 2026 took the review’s key recommendations and turned them into institutions.'],
           ['What that Budget created','A National AI Council chaired by the Prime Minister, overseeing national AI missions in advanced manufacturing, connectivity, finance and healthcare. It also ordered the merger of the skills agency and the jobs agency into a single statutory board.'],
           ['Who leads','The review was overseen by the Deputy Prime Minister, who is also Minister for Trade and Industry, so the person running the review runs the ministry that implements it.']]},
  {id:'fec',layer:2,lane:'one',col:3,span:2,kind:'tripartite',
   name:'Future Economy Council',role:'Standing body, owns it',
   detail:[['Created','2017, chaired by the Deputy Prime Minister.'],
           ['Its stated job','Grow an open economy where trade associations and chambers, unions, enterprises and individuals come together; strengthen enterprises through industry-specific approaches; and help Singaporeans acquire deep skills.'],
           ['How it is organised','Seven clusters, aligned to the national research plan.'],
           ['Why it matters','A big review sets direction every several years. This council carries it in between, which is why direction does not lapse.']]},

  {id:'clusters',layer:3,lane:'one',col:1,span:2,kind:'tripartite',
   name:'Cluster sub-committees',role:'One public and one private chair',
   detail:[['What they are','Sub-committees of the council above. Six tripartite sub-committees, each led by a public and a private sector co-chair, coordinating the effort for one grouping of industries. The grouping is the cluster. The sub-committee is the body.'],
           ['The named clusters','Manufacturing, Built Environment, Trade and Connectivity, Essential Domestic Services, Modern Services, and Lifestyle.'],
           ['A caution on the count','The finance ministry refers to six sub-committees for six clusters. The trade ministry describes the council as supported by seven clusters. Six are named. Check the current number before putting it on a slide.'],
           ['Who the two chairs actually are','For Built Environment, Minister Desmond Lee on the public side and Lim Ming Yan of CapitaLand on the private side. That is the pattern: a serving minister and a named company executive, in the same chair, over the same group of industries.'],
           ['They are not industry associations','A cluster is a government forum. It is not a trade body and has no members. Do not confuse it with the associations described below.'],
           ['Who the private side actually is','The trade associations and chambers, known as TACs, plus the national employers federation and the union congress. In retail, for example, three associations covering more than 1,100 member companies and around 94,000 workers sit opposite the agencies.'],
           ['Who writes the actual roadmap','Industry Tripartite Committees do the work on each transformation map. That is the room where the agency, the associations, the employers federation and the unions co-create the plan.'],
           ['Where the handoff happens','This sub-committee coordinates. It does not execute. For each sector inside its cluster, one statutory board carries the roadmap and delivers it, which is the box to the right.'],
           ['What actually carries the continuity','Not a document passed between bodies. People. The co-chairs sit on the council above, the same associations and unions sit on the committee that writes each roadmap, and the agency that writes the roadmap is the agency that delivers it. Continuity here is overlapping membership, not handover.'],
           ['Why they are not the same as the box to the right','A sub-committee is a forum with two chairs and no staff. A lead agency is a statutory board with a budget and delivery obligations. The sub-committee steers, the agency executes.']]},
  {id:'leads',layer:3,lane:'one',col:3,span:2,kind:'tripartite',
   name:'Sector lead agencies',role:'One for each of 23 sectors',
   detail:[['This is a role, not a new body','No agency is created here. The lead agencies are the same statutory boards that appear on the delivery row below, wearing a second hat. The investment board leads the roadmaps for electronics, precision engineering, energy and chemicals, aerospace and logistics, and then delivers them.'],
           ['What it receives from the left','A cluster sub-committee coordinates a group of industries and has two co-chairs but no staff. This is where a named institution picks up one sector and becomes accountable for it.'],
           ['The principle','Each sector roadmap has exactly one lead agency. There is no super-agency running everything.'],
           ['Who leads what','The investment board leads its manufacturing sectors. The monetary authority is understood to lead financial services and the civil aviation authority air transport, and the building authority coordinated the built environment work. Confirm any specific pairing before quoting it.'],
           ['What they produce','23 Industry Transformation Maps covering about 80 per cent of the economy, each co-created by government, industry stakeholders and unions.'],
           ['What each roadmap covers','Productivity, internationalisation, innovation, digitalisation, resilience, sustainability, and jobs and skills. Those seven headings are the agency’s objectives for its sector.'],
           ['A worked example, retail','The enterprise agency and the jobs agency jointly launched a Jobs Transformation Map for retail in June 2023. It named four forces reshaping the sector, flagged which existing roles were changing, and identified nine emerging roles including product innovator and sustainability specialist.'],
           ['And how it reached a worker','A Jobs Skills Integrator was launched alongside it, run by the national employers federation with the union congress. It advises companies on redesigning jobs, pools what skills the industry actually needs, and commissions the training from providers and the polytechnics. Three retail associations signed up to it.'],
           ['Why that example is the whole argument','Sector plan, to named emerging role, to pooled skills demand, to a commissioned course. Each step has an owner, and the owner of the sector plan is the owner of the delivery.'],
           ['A known blur','The same agency often writes a roadmap and then delivers it, and the monetary authority writes the financial services roadmap while regulating the sector. Translation and delivery are genuinely less separable here than in Brazil or the Emirates.']]},

  {id:'edb',layer:4,lane:'one',col:1,kind:'tripartite',
   name:'Investment board',role:'Foreign firms, its own sectors',
   detail:[['Its full name','The Economic Development Board.'],
           ['What it does','Investment promotion and industry development in manufacturing and internationally tradeable services. It brings in foreign companies and multinationals.'],
           ['It is not a whole-economy body','Its mandate is sector specific, not economy wide. The industries within its purview account for more than a third of national output, which is a large share but not the whole.'],
           ['It appears on the row above as well','It is one of the sector lead agencies. For electronics, precision engineering, energy and chemicals, aerospace and logistics it writes the roadmap and then delivers it. That is drawn as a relationship rather than a second box.'],
           ['The tripartite proof, with a name on it','Caryn Lim Tze Ching joined this board with effect from 1 October 2025. She is an assistant secretary-general of the union congress, chief executive of the union employment institute, and head of its job security directorate.'],
           ['Why that is the sharpest fact in this map','A serving union officer is formally seated on the body whose job is attracting global capital. Not consulted. Seated.']]},
  {id:'esg',layer:4,lane:'one',col:2,kind:'tripartite',
   name:'Enterprise agency',role:'Local firms, across sectors',
   detail:[['Its full name','Enterprise Singapore.'],
           ['Formed','1 April 2018, by merging the international trade agency with the domestic enterprise agency.'],
           ['What it does','Helps local companies, especially small and medium ones, to grow, innovate and expand abroad. Grants, loans and insurance, plus startup hubs and collaboration platforms.'],
           ['How the split with the investment board actually works','The first cut is not sectoral, it is ownership. The investment board brings in foreign firms. This agency grows local ones. They run joint schemes where the two meet, such as the partnership programme linking multinationals with local suppliers.'],
           ['A claim removed from this card','An earlier build said the same union officer sat on this board too. Only the investment board seat could be confirmed. Do not repeat the second half of that claim without checking the current board list.'],
           ['A cross link that is confirmed','The chairman of this agency sits on the investment board, so the two delivery arms are joined at board level.'],
           ['What it funds','The network of innovation centres that the shared facility route below draws on.']]},
  {id:'astar',layer:4,lane:'one',col:3,kind:'body',
   name:'Research agency',role:'Does the science',
   detail:[['Its full name','The Agency for Science, Technology and Research.'],
           ['Scale of the base','Singapore has invested about 60 billion Singapore dollars in research over twenty years, and over 50 research institutes and higher learning institutes are open to industry collaboration.'],
           ['How it reaches companies','Through joint labs with named firms, technology transfer, and an operational and technology roadmap service that helps a single company work out which capability it is missing.']]},
  {id:'e2i',layer:4,lane:'one',col:4,kind:'body',
   name:'Union institute',role:'Places and retrains',
   detail:[['Its full name','The Employment and Employability Institute, owned by the union congress.'],
           ['Formed','2008. Its chief executive, Caryn Lim Tze Ching, is also an assistant secretary-general of the union congress and sits on the investment board.'],
           ['What it does','Job matching, career guidance and skills upgrading for workers, and work with employers on recruitment, training and job redesign.'],
           ['Why it belongs on this row','This is a delivery body owned by the labour movement, not a lobbying body. The unions run their own placement and retraining arm alongside the government agencies.'],
           ['Why nothing flows into it','It takes no instruction from the chain above. Its link to the rest of the map is a seat on two boards, which is drawn as a relationship.']]},

  {id:'retrain',layer:5,lane:'one',col:1,kind:'option',
   name:'Retrain into a new role',role:'Skills and jobs agencies',
   detail:[['Owners','SkillsFuture Singapore writes the framework. Workforce Singapore funds the move.'],
           ['These two owners are merging','The Budget of 12 February 2026 announced that both agencies will merge into a single statutory board, jointly overseen by the manpower and education ministries, so that one agency owns jobs and skills together. Both continue their usual services until the new body is ready. Check the current agency names before presenting this row.'],
           ['First, the jobs are named','A Jobs Transformation Map per sector identifies growth jobs, meaning emerging roles with long-term progression, derived from that sector’s transformation trends.'],
           ['Then the skills are listed','A Skills Framework sets out career pathways, existing and emerging skills and the actual courses that teach them. Frameworks now span 38 sectors.'],
           ['Then the move is paid for','Career Conversion Programmes reskill mid-career people into those growth jobs, with up to 90 per cent salary support.'],
           ['Why this is the tightest chain of the four','A company can trace one line from sector plan, to named growth job, to required skills, to 90 per cent of a salary while it retrains someone into the role.'],
           ['Where the framework comes from','It is not bolted on afterwards. It is an integral component of the sector roadmap itself, so the skills answer is derived from the plan rather than guessed at later.']]},
  {id:'redesign',layer:5,lane:'one',col:2,kind:'option',
   name:'Redesign the job',role:'Jobs agency',
   detail:[['Owner','Workforce Singapore.'],
           ['What it funds','From 2026 a workforce transformation package funds job redesign, pre-approved consultants, and training for human resource teams and line managers.'],
           ['Why it is a separate route','Sometimes the gap is not in the worker. It is in how the work is arranged, and no amount of training fixes that.'],
           ['A caution on currency','This package is new. Its terms should be checked against the current agency pages before use with a client.']]},
  {id:'facility',layer:5,lane:'one',col:3,kind:'option',
   name:'Use a shared facility',role:'Enterprise and research agencies',
   detail:[['Why the route exists','A small firm cannot buy the equipment or hire the specialists alone, so the capability is pooled and shared.'],
           ['Innovation centres','Hosted at the polytechnics and the national manufacturing institute, co-developing robotics and autonomous systems, data science, artificial intelligence and additive manufacturing.'],
           ['The remanufacturing centre','A public-private platform with a university partner, sited in an industrial park, with a consortium of over 95 members from multinationals to startups across five industry pillars.'],
           ['The model factory','A learning factory where companies can experience and experiment with advanced manufacturing before committing to it.'],
           ['National programmes','Shared programme offices for robotics, additive manufacturing and manufacturing artificial intelligence.']]},
  {id:'joint',layer:5,lane:'one',col:4,kind:'option',
   name:'Open a joint lab',role:'Research agency',
   detail:[['What it is','A laboratory set up with a named company to solve that company’s problem, with the results spreading to its suppliers.'],
           ['The worked example','A smart manufacturing joint lab set up in 2017 with an engine maker and an engine services firm deployed 18 technologies, delivered over 20 per cent productivity gains, engaged more than 200 local small firms and qualified eight of them as approved vendors.'],
           ['Finding the gap first','The agency runs an operational and technology roadmap service that helps one company work out which capability it is actually missing.'],
           ['Why it is a route and not a body','Each lab is created for a partner and closes when the work is done.']]},

  {id:'jtc',layer:6,lane:'one',col:1,span:4,kind:'body',
   name:'Industrial land agency',role:'Holds most of the land',
   detail:[['Its full name','JTC Corporation.'],
           ['What it holds','It is the lead agency for industrial infrastructure and manages more than 80 per cent of Singapore’s industrial land, including Jurong Island, one-north and the Jurong Innovation District.'],
           ['Why this row is short','There is one national land agency and no jurisdictional split, so land is a single decision rather than a negotiation.'],
           ['What it also builds','Specialised parks and innovation districts, including the industrial park that houses the shared remanufacturing centre above.']]}
 ],

  {from:'e2i',to:'esg',label:'a union officer sits here'},

{
 id:'uae', name:'United Arab Emirates', flag:FLAGS.uae,
 sub:'One target is chosen for the whole country, then the tools divide. Industries that already exist are grown by guaranteeing them a customer. Industries that barely exist are grown by funding research and buying companies. Both still need land and a licence from an emirate.',
 lanesFrom:3,
 lanes:[{key:'have',label:'Sectors that already exist',cols:3},{key:'new',label:'Sectors that barely exist yet',cols:2}],
 nodes:[
  {id:'pmo',layer:1,gcol:1,gspan:2,kind:'body',
   name:'Prime Minister’s Office',role:'Holds the long term vision',
   detail:[['Where it sits','Inside the Ministry of Cabinet Affairs, which also contains the national statistics centre.'],
           ['What it owns','UAE Centennial 2071, the fifty year national plan the industrial target had to fit inside.'],
           ['Where that came from','A 2017 lecture by Sheikh Mohamed bin Zayed, later launched as a plan by Sheikh Mohammed bin Rashid.'],
           ['What it did not supply','Any study of the industrial sector. It supplied the frame, not the number.']]},
  {id:'unido',layer:1,gcol:3,gspan:1,kind:'body',
   name:'UN industrial agency',role:'Ranks countries on industry',
   detail:[['Its full name','The United Nations Industrial Development Organization, known as UNIDO.'],
           ['What it supplied','Its Competitive Industrial Performance index. The UAE ranked 35th and set a goal of 25th.'],
           ['Progress since','The UAE reached 29th in the 2023 report and 27th after that, first among Arab countries.'],
           ['Why it matters','This is the only input to the target from outside the country, and the only one with no stake in the result.']]},

  {id:'apex',layer:2,gcol:1,gspan:3,kind:'body',
   name:'President and Prime Minister',role:'Choose the national target',
   detail:[['Who they are','The Ruler of Abu Dhabi holds the presidency. The Ruler of Dubai is Vice President and Prime Minister.'],
           ['What they chose','In 2021, raising industry from AED 133 billion to AED 300 billion of national output by 2031.'],
           ['Why two and not seven','A council of all seven rulers is the constitutional apex, but it ratifies rather than initiates. These two announced this.'],
           ['What they did not choose','No sectors, no programmes and no money. Only the number and the direction.'],
           ['Who checked the number','Nobody independent. The three inputs were the rulers’ own long term vision, an external ranking, and the ministry that would be measured against it.'],
           ['A note on dating','The ministry’s own release and later reporting give different launch dates in 2021, so the month is best treated as unsettled.']]},
  {id:'adec',layer:2,gcol:5,gspan:2,kind:'body',
   name:'Abu Dhabi Executive Council',role:'Chooses its own targets',
   detail:[['Who chairs it','The Crown Prince of Abu Dhabi, son of the President.'],
           ['For existing industry','It approved the Abu Dhabi Industrial Strategy in 2022: AED 10 billion of the emirate’s own money to more than double manufacturing to AED 172 billion by 2031, with 13,600 skilled jobs and non-oil exports up to AED 178.8 billion.'],
           ['For new industry','The same council chairs the research council that runs the right hand side of this diagram.'],
           ['Why it can do this','Under the constitution the emirates hold every power not given to the federation, and each emirate owns the natural wealth within it. Abu Dhabi therefore has both the authority and the money.'],
           ['The arithmetic','Its AED 172 billion is most of the national AED 300 billion. Abu Dhabi already makes up over half of UAE industrial output.']]},

  {id:'cabinet',layer:3,lane:'have',col:1,kind:'body',
   name:'Federal Cabinet',role:'Makes it law',
   detail:[['What only it can do','Issue a binding federal law, change an import tariff, or grant a customs exemption. No ministry can do these.'],
           ['The main law','Federal Decree-Law 25 of 2022 on regulating and developing industry, with executive regulations in 2023. It created the compulsory industrial register.'],
           ['Examples of decisions','Creating the Industry Development Council in December 2021, raising steel import duties from 5% to 10% for three years, and exempting imported inputs that cannot be made locally.'],
           ['Who chairs it','The Prime Minister, who is also one of the two who chose the target.'],
           ['How it relates to the ministry','The ministry proposes, the Cabinet enacts. The customs exemption policy, for instance, was proposed by the ministry and approved by the Cabinet.']]},
  {id:'ministry',layer:3,lane:'have',col:2,kind:'body',
   name:'Industry ministry',role:'Designs the instruments',
   detail:[['Its full name','The Ministry of Industry and Advanced Technology, often shortened to MoIAT.'],
           ['Created','July 2020, by merging the advanced technology office, the standards authority and the industrial arm of the energy ministry. All their powers transferred to it.'],
           ['Who runs it','Sultan Al Jaber, who is also chief executive of ADNOC, the national oil company, and chairman of the federal development bank. His deputy previously ran ADNOC’s local content directorate.'],
           ['What it designs','The list of priority sectors, the published list of products to make locally, the local content scoring formula, a factory maturity assessment, and the annual Make it in the Emirates event.'],
           ['The product list today','More than 5,000 products worth about AED 180 billion of forecast demand, of which AED 81.5 billion has been filled.'],
           ['When the intelligence arrived','The registry and the forecasting apparatus were built from 2022, after the target. The compulsory register came a year after the number existed.'],
           ['What it cannot do','Pass a law, grant land, issue a licence, or spend an emirate’s money.']]},
  {id:'council',layer:3,lane:'have',col:3,kind:'body',
   name:'Industry Development Council',role:'Gets the emirates to agree',
   detail:[['Created','Approved by the Cabinet in December 2021, nine months after the strategy it serves. It set its own mandate at its first meeting.'],
           ['Who sits on it','Sixteen seats: federal ministries, the statistics centre, customs, the economic departments of six emirates, the federal development bank, the defence procurement body, and one seat for the chambers of commerce.'],
           ['Who chairs it','The industry minister, with the foreign trade minister as deputy.'],
           ['What it agrees','One industrial law across all seven emirates, tariff changes, customs exemptions, and persuading emirates to adopt federal schemes.'],
           ['Why it is needed','No emirate is obliged to join a federal programme. Ras Al Khaimah and Fujairah adopting the local content scheme was a council outcome, not a legal requirement.']]},
  {id:'adrc',layer:3,lane:'new',col:1,span:2,kind:'body',
   name:'Abu Dhabi research council',role:'Picks the technologies',
   detail:[['Its full name','The Advanced Technology Research Council, known as ATRC.'],
           ['Who chairs it','The Crown Prince of Abu Dhabi, the same person who chairs the Executive Council.'],
           ['Its six areas','Aerospace and space, food and agriculture, healthcare, safety and security, sustainability and energy, and transport.'],
           ['Why it exists here','For a sector nobody buys from yet, there is no demand to publish and no tender to score. Somebody has to simply choose, and this is the body that does.'],
           ['What it is not','It is not federal, and it has no national mandate. It belongs to one emirate.']]},

  {id:'bank',layer:4,lane:'have',col:1,kind:'body',
   name:'Federal development bank',role:'Lends so it gets built',
   detail:[['Its full name','Emirates Development Bank.'],
           ['Its mandate','AED 30 billion over five years to finance 13,500 small and medium manufacturers in priority sectors.'],
           ['What lending means here','The company borrows, builds and repays, and stays independently owned. This closes a money gap, not a skills gap.'],
           ['Who chairs it','The industry minister, so the body designing the lists also chairs the bank funding them.']]},
  {id:'buyers',layer:4,lane:'have',col:2,kind:'body',
   name:'Government-owned buyers',role:'Promise to buy the output',
   detail:[['Who they are','Large companies owned by the state or by an emirate: ADNOC in oil and gas, TAQA in utilities, EDGE in defence, Masdar in renewables, Emaar in property, ENEC in nuclear, and roughly twenty more.'],
           ['What they sign','Long term purchase contracts. At the 2026 event, twelve of these companies committed close to AED 100 billion of future purchases, and separate supply contracts of five to twenty-five years totalled about AED 105 billion.'],
           ['A worked example','A chemicals producer agreed to supply 200,000 tonnes a year of caustic soda to a domestic aluminium refinery, replacing an import.'],
           ['Their second act','They apply the local content score inside their own tender evaluations, so a domestic supplier beats an importer. The formula is the ministry’s, but it only bites because these companies enforce it when buying.'],
           ['Their third act','They hand the ministry their ten year purchase forecasts, which is what the published product list is built from.'],
           ['Why the federal toolkit stops here','Every federal instrument needs an existing purchase. That is why it cannot serve the right hand lane.']]},
  {id:'funds',layer:4,lane:'new',col:2,kind:'body',
   name:'Abu Dhabi sovereign funds',role:'Own the capability',
   detail:[['Who they are','Mubadala and ADQ, investment companies owned by Abu Dhabi and funded from the emirate’s own resource wealth.'],
           ['How they source capability','By purchase rather than persuasion.'],
           ['Why they are not under the research council','They are separate investment vehicles answering to the Executive Council, not research bodies.']]},

  {id:'place',layer:5,lane:'have',col:1,kind:'option',
   name:'Place and train Emiratis',role:'Jobs programme',
   detail:[['Owner','Nafis, run by the Emirati Talent Competitiveness Council.'],
           ['Why this route works on this side','The employer already exists, so a person can be placed into a working factory and trained on the job or through short courses bought from providers.'],
           ['Who builds the courses','The Industrialists Programme, run with the industry ministry and the labour ministry, assembles training with industrial companies and specialised training centres.'],
           ['Why employers want it','The local content score counts Emirati salaries for more than expatriate ones, so hiring Emiratis raises a supplier’s tender score.'],
           ['Its limit','The programme funds and places rather than teaching. It owns no institutes, so it cannot create a skill that nobody in the country already practises.']]},
  {id:'attract',layer:5,lane:'have',col:2,kind:'option',
   name:'Attract the firm that has it',role:'Industry ministry and zones',
   detail:[['How the capability arrives','Inside a foreign company, rather than being built by anyone here.'],
           ['What is offered','A guaranteed purchase from the state-owned buyers above, plus land and utilities from an industrial zone.'],
           ['A worked example','A AED 700 million pharmaceutical plant agreed in 2026: the company led the technical and regulatory work, the zone operator supplied land, infrastructure and utilities.'],
           ['What it does not do','The know how stays with the firm that brought it. This route rents a capability rather than creating one.']]},
  {id:'specialists',layer:5,lane:'have',col:3,kind:'option',
   name:'Bring in specialists',role:'Federal government',

/* -------------------------------------------------------------- plumbing */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let active=COUNTRIES[0].id, selected=null;

function cols(lanes){ return lanes.map(l=>`repeat(${l.cols},minmax(0,1fr))`).join(' 46px '); }
function laneStart(lanes,i){ return lanes.slice(0,i).reduce((a,x)=>a+x.cols+1,1); }
function relsOf(sp,id){ return (sp.rel||[]).filter(r=>r.from===id||r.to===id); }

function legendFor(c){
  const ns=c.nodes, rels=(c.rel||[]).length;
  const items=['<span><i class="key"></i>Named institution</span>'];
  if(ns.some(n=>n.kind==='mechanism')) items.push('<span><i class="key mech"></i>Mechanism, no institution exists</span>');
  if(ns.some(n=>n.kind==='option')) items.push('<span><i class="key opt"></i>A route, not a body. The line under it names the owner</span>');
  if(ns.some(n=>n.kind==='detached')) items.push('<span><i class="key det"></i>Not connected to this chain</span>');
  if(ns.some(n=>n.kind==='shared')) items.push('<span><i class="key shared"></i>Needed by both sides</span>');
  if(ns.some(n=>n.kind==='tripartite')) items.push('<span><i class="key tri"></i>Government, business and unions sit together</span>');
  if(rels) items.push('<span><i class="key dot"></i>Click to reveal its relationships</span>');
  return `<div class="legend">${items.join('')}</div>`;
}

const KINDCLASS={mechanism:'mech',detached:'detached',shared:'shared',tripartite:'tri',option:'opt'};

function buildBoard(sp){
  const gt=cols(sp.lanes);
  const absent=sp.absent||{};
  const used=LAYERS.map((L,i)=>i+1).filter(i=>sp.nodes.some(n=>n.layer===i)||absent[i]);
  const from=sp.lanesFrom||1;
  const laneHeads=sp.lanes.map((l,i)=>
    `<div class="lane-h" style="grid-column:${laneStart(sp.lanes,i)} / span ${l.cols}">${esc(l.label)}</div>`).join('');
  const laneBar = sp.lanes.length<2 ? '' :
    `<div class="lanes"><div></div><div class="row" style="grid-template-columns:${gt}">${laneHeads}</div></div>`;
  const barAt = used.includes(from) ? from : used[0];
  const rows=used.map(li=>{
    const L=LAYERS[li-1];
    const ns=sp.nodes.filter(n=>n.layer===li).map(n=>{
      let gc;
      if(n.lane){
        const offset=laneStart(sp.lanes,sp.lanes.findIndex(l=>l.key===n.lane));
        gc=`${offset+n.col-1} / span ${n.span||1}`;
      } else gc=`${n.gcol} / span ${n.gspan||1}`;
      const hasRel=relsOf(sp,n.id).length>0;
      return `<button class="node ${KINDCLASS[n.kind]||''}"
        data-node="${n.id}" aria-pressed="${selected===n.id}" style="grid-column:${gc}">
        ${hasRel?'<span class="rels" aria-hidden="true"></span>':''}
        <span class="nm">${esc(n.name)}</span><span class="role">${esc(n.role)}</span></button>`;
    }).join('');
    const gap = absent[li] ? `<div class="absent"><span class="nm">Nothing sits here</span>
        <p>${esc(absent[li])}</p></div>` : '';
    return `${li===barAt?laneBar:''}<div class="layer">
        <div class="lhead"><div class="num">${L.num}</div><div class="nm">${L.name}</div>
          <div class="note">${esc(L.note)}</div></div>
        <div class="row" style="grid-template-columns:${gt}">${ns}${gap}</div>
      </div>`;
  }).join('');
  return `<div class="board">
      <svg class="wires" aria-hidden="true"></svg>${rows}
      <svg class="wires top" aria-hidden="true"></svg></div>`;
}

function renderTabs(){
  $('#tabs').innerHTML=COUNTRIES.map(c=>`<li role="presentation">
    <button class="tab" role="tab" data-id="${c.id}" aria-selected="${c.id===active}" tabindex="${c.id===active?0:-1}">
      ${c.flag}<span>${esc(c.name)}</span>${c.nodes?'':'<span class="soon">soon</span>'}
    </button></li>`).join('');
}

const KICKER={mechanism:'Mechanism, not an institution',detached:'Not connected to this chain',
              option:'Route, not a body',shared:'Institution, needed by both sides',
              tripartite:'Institution, all three parties inside'};

function renderDetail(c){
  const box=$('#detail'); if(!box) return;
  if(!selected){
    box.innerHTML='<p class="idle">Select any box above. The panel will show who runs it, when it was created, how it is funded, and what it cannot do. Its relationships to other boxes appear in the diagram.</p>';
    return;
  }
  const n=c.nodes.find(x=>x.id===selected);
  if(!n){ selected=null; return renderDetail(c); }
  const rs=relsOf(c,selected);
  const rows=[...n.detail];
  if(rs.length){
    const nm=id=>c.nodes.find(x=>x.id===id).name;
    const byLabel=new Map();
    rs.forEach(r=>{ const g=byLabel.get(r.label)||{note:null,who:[]};
      if(r.note) g.note=r.note;
      g.who.push(nm(r.from===selected?r.to:r.from));
      byLabel.set(r.label,g); });
    const list=a=>a.length===1?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];
    rows.push(['Its relationships',
      [...byLabel.entries()].map(([lab,g])=> g.note
        || (lab.charAt(0).toUpperCase()+lab.slice(1)+': '+list(g.who)+'.')).join(' ')]);
  }
  box.innerHTML=`<div class="kicker">${esc(LAYERS[n.layer-1].name)} &nbsp;&middot;&nbsp; ${esc(KICKER[n.kind]||'Institution')}</div>
    <h3>${esc(n.name)}</h3><p class="lede">${esc(n.role)}</p>
    <dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
}

function disputeFor(c){
  if(!c.dispute) return '';
  const d=c.dispute;
  return `<div class="dispute"><h4>${esc(d.title)}</h4>
    <div class="cols">${d.sides.map(([k,v])=>`<div class="side"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}</div>
    <p class="foot">${esc(d.foot)}</p></div>`;
}

function render(){
  renderTabs();
  const c=COUNTRIES.find(x=>x.id===active), stage=$('#stage');
  stage.innerHTML=`
    <div class="intro"><h2>${esc(c.name)}</h2><p>${esc(c.sub)}</p></div>
    <p class="hint"><i class="key dot"></i>Click any card to open its detail below, and to reveal how it connects to the others.</p>
    ${buildBoard(c)}
    ${legendFor(c)}
    ${disputeFor(c)}
    <div class="detail" id="detail"></div>`;
  renderDetail(c);
  draw();
}

/* ---- connectors measured from the rendered boxes ---- */
function draw(){
  const c=COUNTRIES.find(x=>x.id===active);
  document.querySelectorAll('.board').forEach(board=>drawBoard(c,board));
  if(CHECK) runCheck();
}

function drawBoard(sp,board){
  const svg=board.querySelector('.wires:not(.top)');
  if(!svg) return;
  const B=board.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${B.width} ${B.height}`);
  const box=id=>{ const el=board.querySelector(`[data-node="${id}"]`); if(!el) return null;
    const r=el.getBoundingClientRect();
    return {l:r.left-B.left,t:r.top-B.top,r:r.right-B.left,b:r.bottom-B.top,
            cx:r.left-B.left+r.width/2,cy:r.top-B.top+r.height/2}; };

  const bySrc={}; (sp.flow||[]).forEach(f=>{ (bySrc[f.from]=bySrc[f.from]||[]).push(f); });
  const order=Object.keys(bySrc);
  const layerOf={}; sp.nodes.forEach(n=>layerOf[n.id]=n.layer);
  const allLefts=[...board.querySelectorAll('.node')].map(e=>e.getBoundingClientRect().left-B.left);
  const chan=Math.max(8,Math.min(...allLefts)-16);

  const rects=[...board.querySelectorAll('.node')].map(el=>{const r=el.getBoundingClientRect();
    return {l:r.left-B.left,t:r.top-B.top,r:r.right-B.left,b:r.bottom-B.top};});

  const paths=[];
  let bypass=0;
  for(const src of order){
    const a=box(src); if(!a) continue;
    bySrc[src].forEach(f=>{
      const b=box(f.to); if(!b) return;

      /* A flow that skips a row leaves its own row, runs down the left channel,
         then crosses in the empty gap ABOVE the target row. Crossing at the
         target's own height would run the line straight through the boxes
         standing between the channel and the target. */
      if(layerOf[f.to]-layerOf[f.from]>1){
        /* stagger the exit as well as the entry, or two bypasses leaving the
           same box run down one line and land on each other */
        const r=9, y1=a.b+16+10*bypass, y2=b.t-20-9*bypass;
        bypass++;
        paths.push(`M ${a.cx} ${a.b} L ${a.cx} ${y1-r} Q ${a.cx} ${y1} ${a.cx-r} ${y1} `+
          `L ${chan+r} ${y1} Q ${chan} ${y1} ${chan} ${y1+r} `+
          `L ${chan} ${y2-r} Q ${chan} ${y2} ${chan+r} ${y2} `+
          `L ${b.cx-r} ${y2} Q ${b.cx} ${y2} ${b.cx} ${y2+r} L ${b.cx} ${b.t-6}`);
        return;
      }

      /* a flow inside one row runs edge to edge, and dips below the row if
         another box stands in the way. Drawn down the middle it would run
         straight through the box it points at. */
      if(layerOf[f.to]===layerOf[f.from]){
        const right=b.cx>a.cx, x1=right?a.r:a.l, x2=right?b.l-6:b.r+6;
        const lo=Math.min(x1,x2), hi=Math.max(x1,x2);
        const blocked=rects.some(n=>n.t<a.b-1&&n.b>a.t+1&&n.l>lo+1&&n.r<hi-1);
        paths.push(blocked
          ? `M ${a.cx} ${a.b} C ${a.cx} ${a.b+44} ${b.cx} ${b.b+44} ${b.cx} ${b.b+6}`
          : `M ${x1} ${a.cy} L ${x2} ${a.cy}`);
        return;
      }

      /* stagger each parent's fan inside the vertical gap so two parents never
         share a horizontal line. The spread stays inside the gap however many
         parents there are, or the line lands on the row it points at. */
      const gap=b.t-a.b;
      const peers=order.filter(s=>{const p=box(s);return p&&Math.abs(p.b-a.b)<2;});
      const idx=Math.max(0,peers.indexOf(src));
      const m=a.b+gap*(peers.length>1?(0.30+0.45*idx/(peers.length-1)):0.5);
      const R=Math.min(10,Math.abs(b.cx-a.cx)/2,gap/4)||0;
      const s=Math.sign(b.cx-a.cx);
      paths.push(Math.abs(b.cx-a.cx)<2
        ? `M ${a.cx} ${a.b} L ${b.cx} ${b.t-6}`
        : `M ${a.cx} ${a.b} L ${a.cx} ${m-R} Q ${a.cx} ${m} ${a.cx+s*R} ${m} `+
          `L ${b.cx-s*R} ${m} Q ${b.cx} ${m} ${b.cx} ${m+R} L ${b.cx} ${b.t-6}`);
    });
  }

  /* relationship curves, worked out before anything is painted so that the
     labels can be placed against the finished picture */
  const curves=[];
  if(selected&&sp.nodes.some(n=>n.id===selected)){
    relsOf(sp,selected).forEach(r=>{
      const a=box(r.from),b=box(r.to); if(!a||!b) return;
      const down=b.t>a.b, up=b.b<a.t, sameRow=Math.abs(a.cy-b.cy)<20;
      let p1,p2,c1,c2;
      if(sameRow){                                   // dip below the row
        const dip=46; p1=[a.cx,a.b]; p2=[b.cx,b.b];
        c1=[a.cx,a.b+dip]; c2=[b.cx,b.b+dip];
      } else if(down||up){ p1=[a.cx,down?a.b:a.t]; p2=[b.cx,down?b.t:b.b];
        const k=(p2[1]-p1[1])*0.42; c1=[p1[0]+(p2[0]-p1[0])*0.15,p1[1]+k]; c2=[p2[0]-(p2[0]-p1[0])*0.15,p2[1]-k]; }
      else { const rightward=b.cx>a.cx;
        p1=[rightward?a.r:a.l,a.cy]; p2=[rightward?b.l:b.r,b.cy];
        const k=(p2[0]-p1[0])*0.45; c1=[p1[0]+k,p1[1]]; c2=[p2[0]-k,p2[1]]; }
      curves.push({label:r.label,sameRow,p1,c1,c2,p2});
    });
  }

  svg.innerHTML=`<defs>
      <marker id="a1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M1 1.5 6 5 1 8.5" fill="none" stroke="#8C8C8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M1 1.5 6 5 1 8.5" fill="none" stroke="#003B48" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>`+
    paths.map(d=>`<path class="flow" data-lab="" d="${d}" fill="none" stroke="#C2C2C2" stroke-width="1.5" marker-end="url(#a1)"/>`).join('')+
    curves.map(c=>`<path data-lab="${esc(c.label)}" d="M ${c.p1[0]} ${c.p1[1]} C ${c.c1[0]} ${c.c1[1]} ${c.c2[0]} ${c.c2[1]} ${c.p2[0]} ${c.p2[1]}"
      fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>`).join('');

  /* Place each label on the first point along its curve that clears every box
     AND every line already drawn. Testing boxes alone was the known gap in the
     old validators: it let a connector run straight through the wording. */
  const ink=[...svg.querySelectorAll('path[data-lab]')].map(p=>{
    const pts=[], len=p.getTotalLength();
    for(let d=0;d<=len;d+=7){const q=p.getPointAtLength(d);pts.push([q.x,q.y]);}
    return {lab:p.dataset.lab,pts};
  });
  let labs='';
  const seen=new Set();
  curves.forEach(c=>{
    if(seen.has(c.label)) return;
    seen.add(c.label);
    const at=t=>{const u=1-t;return [
      u*u*u*c.p1[0]+3*u*u*t*c.c1[0]+3*u*t*t*c.c2[0]+t*t*t*c.p2[0],
      u*u*u*c.p1[1]+3*u*u*t*c.c1[1]+3*u*t*t*c.c2[1]+t*t*t*c.p2[1]];};
    const halfW=c.label.length*3.6+7, halfH=11, dy=c.sameRow?14:-8;
    /* a vertical curve gives every point along it the same x, so the label has
       to be allowed sideways as well as up and down or it can never step off a
       line running the same way */
    let best=at(.5), bestDy=dy, bestDx=0, score=Infinity;
    for(const t of [.5,.36,.64,.24,.76,.15,.85]){
      const q=at(t);
      for(const d of [dy,dy-16,dy+16,dy-30,dy+30,dy-44,dy+44]){
        for(const dx of [0,halfW+16,-(halfW+16),halfW+40,-(halfW+40)]){
          const lb={l:q[0]+dx-halfW,r:q[0]+dx+halfW,t:q[1]+d-halfH,b:q[1]+d+halfH};
          let s=0;
          rects.forEach(n=>{ if(lb.l<n.r&&lb.r>n.l&&lb.t<n.b&&lb.b>n.t) s+=100; });
          ink.forEach(o=>{ if(o.lab===c.label) return;
            o.pts.forEach(([x,y])=>{ if(x>lb.l&&x<lb.r&&y>lb.t&&y<lb.b) s++; }); });
          if(s<score){ score=s; best=q; bestDy=d; bestDx=dx; }
          if(!score) break;
        }
        if(!score) break;
      }
      if(!score) break;
    }
    labs+=`<text class="wirelab" x="${best[0]+bestDx}" y="${best[1]+bestDy}" text-anchor="middle">${esc(c.label)}</text>`;
  });

  const lsvg=board.querySelector('.wires.top');
  if(lsvg){ lsvg.setAttribute('viewBox',`0 0 ${B.width} ${B.height}`); lsvg.innerHTML=labs; }

  board.querySelectorAll('.node').forEach(el=>el.classList.remove('linked'));
  if(selected&&sp.nodes.some(n=>n.id===selected)) relsOf(sp,selected).forEach(r=>{
    [r.from,r.to].filter(i=>i!==selected).forEach(i=>
      board.querySelector(`[data-node="${i}"]`)?.classList.add('linked'));
  });
}

/* ---------------------------------------------------------------- checks
   Run any change past these. Open the file with ?check to see the panel.
   The data checks catch broken arrows; the geometry checks catch the class
   of bug the old python validators could not see, which is a connector
   drawn straight through a box or a label.                                */
const CHECK=/[?&]check/.test(location.search);

function checkData(){
  const out=[];
  COUNTRIES.forEach(c=>{
    const ids=new Set();
    c.nodes.forEach(n=>{
      if(ids.has(n.id)) out.push(`${c.id}: two boxes share the id ${n.id}`);
      ids.add(n.id);
      if(!n.detail||!n.detail.length) out.push(`${c.id}: ${n.id} has no detail`);
      if(n.kind==='option'&&n.layer!==5) out.push(`${c.id}: ${n.id} is a route outside layer 05`);
      if(n.layer===5&&n.kind==='body') out.push(`${c.id}: ${n.id} is a body at layer 05, which should hold routes`);
    });
    (c.flow||[]).forEach(f=>{
      if(!ids.has(f.from)||!ids.has(f.to)){ out.push(`${c.id}: flow ${f.from} to ${f.to} misses a box`); return; }
      // lateral flows inside one layer are allowed: a cabinet funds a council,
      // a ministry briefs a council. Upward is not, that is what rel is for.
      const A=c.nodes.find(n=>n.id===f.from), Z=c.nodes.find(n=>n.id===f.to);
      if(Z.layer<A.layer) out.push(`${c.id}: flow ${f.from} to ${f.to} runs upward`);
    });
    (c.rel||[]).forEach(r=>{
      if(!ids.has(r.from)||!ids.has(r.to)) out.push(`${c.id}: relationship ${r.from} to ${r.to} misses a box`);
    });
    Object.keys(c.absent||{}).forEach(k=>{
      if(c.nodes.some(n=>n.layer===+k)) out.push(`${c.id}: layer ${k} is marked empty but holds boxes`);
    });
  });
  return out;
}

function checkGeometry(){
  const out=[], board=document.querySelector('.board');
  if(!board) return out;
  const B=board.getBoundingClientRect();
  const R=el=>{const r=el.getBoundingClientRect();
    return {l:r.left-B.left,t:r.top-B.top,r:r.right-B.left,b:r.bottom-B.top};};
  const nodes=[...board.querySelectorAll('.node')];

  nodes.forEach(el=>{
    if(el.scrollHeight>el.clientHeight+1) out.push(`text overflows the box: ${el.querySelector('.nm').textContent}`);
  });
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const a=R(nodes[i]),b=R(nodes[j]);
    if(a.l<b.r-1&&a.r>b.l+1&&a.t<b.b-1&&a.b>b.t+1)
      out.push(`boxes overlap: ${nodes[i].querySelector('.nm').textContent} and ${nodes[j].querySelector('.nm').textContent}`);
  }
  const boxes=nodes.map(el=>({r:R(el),nm:el.querySelector('.nm').textContent}));
  const labels=[...board.querySelectorAll('.wirelab')].map(t=>{const b=t.getBBox();
    return {r:{l:b.x,t:b.y,r:b.x+b.width,b:b.y+b.height},nm:t.textContent};});
  board.querySelectorAll('path.flow').forEach(p=>{
    const len=p.getTotalLength(); const hits=new Set();
    for(let d=0;d<=len;d+=5){
      const q=p.getPointAtLength(d);
      boxes.forEach(o=>{ if(q.x>o.r.l+2&&q.x<o.r.r-2&&q.y>o.r.t+2&&q.y<o.r.b-2) hits.add('box '+o.nm); });
      labels.forEach(o=>{ if(q.x>o.r.l&&q.x<o.r.r&&q.y>o.r.t&&q.y<o.r.b) hits.add('label '+o.nm); });
    }
    hits.forEach(h=>out.push(`a connector runs through ${h}`));
  });
  return out;
}

function runCheck(){
  const problems=[...checkData(),...checkGeometry()];
  let el=document.getElementById('check');
  if(!el){ el=document.createElement('div'); el.id='check'; document.body.appendChild(el); }
  el.innerHTML=problems.length
    ? `<b>${problems.length} to fix in ${active}</b><ul>${[...new Set(problems)].map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`
    : `<b>clean: ${active}</b><ul><li>arrows land on real boxes, nothing overlaps, no connector crosses a box or a label</li></ul>`;
  return problems;
}
window.check=()=>[...checkData(),...checkGeometry()];

/* ---------------------------------------------------------------- events */
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){ active=tab.dataset.id; selected=null; render(); return; }
  const node=e.target.closest('.node');
  if(node){ selected = selected===node.dataset.node ? null : node.dataset.node;
    render(); if(selected) document.querySelector(`[data-node="${selected}"]`).focus(); }
});
$('#tabs').addEventListener('keydown',e=>{
  if(!['ArrowRight','ArrowLeft'].includes(e.key)) return;
  const i=COUNTRIES.findIndex(c=>c.id===active);
  active=COUNTRIES[(i+(e.key==='ArrowRight'?1:-1)+COUNTRIES.length)%COUNTRIES.length].id;
  selected=null; render(); $('#tabs').querySelector('[aria-selected="true"]').focus();
});
addEventListener('resize',()=>draw());
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
render();
</script>
